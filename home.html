<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Home SN4M</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="home.css">
    </head>
    <body>
        <div class="d-flex min-vh-100 bg-black text-white">

            <!-- Sidebar Desktop -->
            <div class="sidebar bg-dark border-end border-secondary d-none d-md-flex flex-column p-3 text-white">
                <!-- Logo Desktop -->
                <a href="#" class="d-flex align-items-center mb-4 text-white text-decoration-none">
                    <span class="fs-3 fw-bold text-success mx-auto brand-text">SN4M</span>
                </a>
                <ul class="nav nav-pills flex-column mb-auto gap-2">
                    <li class="nav-item">
                        <a href="#" class="nav-link active text-white fw-semibold bg-secondary bg-opacity-25" title="Home">
                            <span class="nav-icon">🏠</span> 
                            <span class="sidebar-text ms-2">Home</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-link text-white fw-semibold hover-grey" title="Ricerca">
                            <span class="nav-icon">🔍</span> 
                            <span class="sidebar-text ms-2">Ricerca</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-link text-white fw-semibold hover-grey" title="Libreria">
                            <span class="nav-icon">📚</span> 
                            <span class="sidebar-text ms-2">Libreria</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-link text-white fw-semibold hover-grey" title="Le tue Playlist">
                            <span class="nav-icon">🎵</span> 
                            <span class="sidebar-text ms-2">Le tue Playlist</span>
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Colonna Centrale (Navbar + Dashboard) -->
            <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
                
                <!-- Navbar Superiore -->
                <nav class="navbar navbar-expand navbar-dark topbar-musica px-4 py-3 sticky-top">
                    <div class="container-fluid d-flex justify-content-between align-items-center">
                        
                        <!-- Aggiunta classe: logo-sezione -->
                        <div class="d-flex align-items-center logo-sezione">
                            <span class="fw-bold fs-4 d-md-none me-2 text-success">SN4M</span>
                        </div>

                        <!-- Sezione centrale invariata -->
                        <form class="d-flex mx-auto search-form flex-grow-1 px-2" role="search">
                            <div class="input-group search-group mx-auto">
                                <span class="input-group-text bg-dark border-0 text-secondary">🔍</span>
                                <input class="form-control border-0 bg-dark text-white shadow-none" type="search" placeholder="Cosa ascoltiamo?" aria-label="Search">
                            </div>
                        </form>

                        <!-- Aggiunta classe: profilo-sezione -->
                        <ul class="navbar-nav align-items-center profilo-sezione">
                            <li class="nav-item dropdown">
                                <a class="nav-link dropdown-toggle d-flex align-items-center text-white text-decoration-none p-1 rounded-pill bg-dark hover-grey" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                    <img src="https://ui-avatars.com/api/?name=User&background=1DB954&color=fff" alt="User" class="rounded-circle me-2" width="32" height="32">
                                    <span id="nomeUtenteNav" class="d-none d-md-inline fw-semibold me-2 pe-1">Profilo</span>
                                </a>
                                <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow mt-2 border-0">
                                    <li><a class="dropdown-item fw-semibold" href="#">Account</a></li>
                                    <li><hr class="dropdown-divider border-secondary"></li>
                                    <li><a class="dropdown-item text-danger fw-semibold" href="#" id="btnLogout">Esci</a></li>
                                </ul>
                            </li>
                        </ul>
                    </div>
                </nav>
                
                <!-- Dashboard Principale -->
                <main class="flex-grow-1 p-4 main-content">
                    <h2 class="fw-bold mb-4">I tuoi preferiti</h2>
                    <!-- Le card degli artisti andranno qui -->
                </main>
            </div>

            <!-- Barra Navigazione Inferiore Mobile -->
            <nav class="mobile-bottom-bar bg-dark border-top border-secondary d-md-none fixed-bottom text-center d-flex justify-content-around py-2">
                <a href="#" class="text-white text-decoration-none d-flex flex-column align-items-center flex-fill opacity-75">
                    <span class="fs-5 mb-1">🏠</span>
                    <small class="fw-semibold" style="font-size: 0.7rem;">Home</small>
                </a>
                <a href="#" class="text-white text-decoration-none d-flex flex-column align-items-center flex-fill opacity-75">
                    <span class="fs-5 mb-1">🔍</span>
                    <small class="fw-semibold" style="font-size: 0.7rem;">Cerca</small>
                </a>
                <a href="#" class="text-white text-decoration-none d-flex flex-column align-items-center flex-fill opacity-75">
                    <span class="fs-5 mb-1">📚</span>
                    <small class="fw-semibold" style="font-size: 0.7rem;">Libreria</small>
                </a>
                <a href="#" class="text-white text-decoration-none d-flex flex-column align-items-center flex-fill opacity-75">
                    <span class="fs-5 mb-1">🎵</span>
                    <small class="fw-semibold" style="font-size: 0.7rem;">Playlist</small>
                </a>
            </nav>
            
            <!-- Qui andrà il resto del contenuto (Sidebar e Area Principale) -->
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="home.js"></script>
    </body>
</html>
