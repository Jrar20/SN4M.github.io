<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Registrazione Utente</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="registrazioneUtente.css">
    </head>
    <body class="bg-black bg-gradient text-white">
        <main class="fullscreen-container">

            <header class="text-center mb-4">
                <h1 class="brand-title">SN4M</h1>
                <span class="text-secondary">Crea il tuo account</span>
            </header>

            <form id="form-registrazione" class="responsive-form">
                <div class="input-group mb-3">
                    <span class="input-group-text">Username</span>
                    <input type="text" class="form-control" id="username" placeholder="Inserisci username" required>
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text">Email</span>
                    <input type="email" class="form-control" id="email" placeholder="nome@esempio.com" required>
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text">Password</span>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-light w-100 fw-bold mt-2">Registrati</button>

                <div class="text-center mt-3">
                    <small class="text-secondary">
                        Hai già un account? <a href="login.html" class="text-white text-decoration-underline">Accedi qui</a>
                    </small>
                </div>
            </form>

        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
