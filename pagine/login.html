<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>SN4M Login</title>
        <script src="login.css"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <div class="w-100 min-vh-100 d-flex flex-column justify-content-center align-items-center bg-black bg-gradient text-white">
            <div class="text-center d-flex mb-3">
                <img src="spotifyLogo.png" class="img-fluid d-block mx-3 mb-3" style="max-width: 60px;" alt="SN4Mlogo">
                <div class="d-flex mt-1">
                    <h1>SN</h1><h1 class="text-success">4</h1><h1>M</h1>
                </div>
            </div>
            <div class="input-group mb-3 w-25">
                <span class="input-group-text" id="email">Email</span>
                <input type="text" class="form-control" placeholder="Inserisci qui" aria-describedby="email">
            </div>
            <div class="input-group mb-3 w-25">
                <span class="input-group-text" id="psw">Password</span>
                <input type="text" class="form-control" placeholder="Inserisci qui" aria-describedby="psw">
            </div>
            <button type="submit" class="btn btn-success btn-lg my-3">Login</button>
            <p><a href="registrazioneUtente.html" class="link-success">Oppure registrati ora!</a></p>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
