<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Registrazione Utente</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="registrazioneUtente.css">
    </head>
    <body>
        <div class="fullscreen-container bg-black bg-gradient text-white">

            <div class="register-wrapper w-100 d-flex flex-column align-items-center">

                <div class="text-center mb-4">
                    <h1 class="brand-title">SN4M</h1>
                    <span class="text-secondary">Crea il tuo account</span>
                </div>

                <form id="form-registrazione" class="responsive-form w-100 d-flex flex-column align-items-center">
                    <div class="input-group mb-3 w-100">
                        <span class="input-group-text bg-success-subtle">Username</span>
                        <input type="text" class="form-control form-control-responsive" id="username" placeholder="Inserisci username" required>
                    </div>

                    <div class="input-group mb-3 w-100">
                        <span class="input-group-text bg-success-subtle">Email</span>
                        <input type="email" class="form-control form-control-responsive" id="email" placeholder="nome@esempio.com" required>
                    </div>

                    <div class="input-group mb-3 w-100">
                        <span class="input-group-text bg-success-subtle">Password</span>
                        <input type="password" class="form-control form-control-responsive" id="password" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-success btn-submit mt-2">Registrati</button>

                    <div class="text-center mt-3">
                        <small class="text-secondary">
                            Hai già un account? <a href="index.html" class="text-success">Accedi qui</a>
                        </small>
                    </div>
                </form>

            </div>

        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
